# ELEZON — build the Vite app and publish it to GitHub Pages.
# Supabase URL/anon key are injected at build time from repository secrets
# (Settings → Secrets and variables → Actions). The anon key is public-safe;
# data is protected by Row-Level Security.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+ ships a global WebSocket, which @supabase/supabase-js needs
          # when the client is created during the build-time SSG render. On Node 20
          # createClient throws ("Node.js 20 detected without native WebSocket").
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Live on the apex domain elezon.ru → base '/' (vite.config default).
          # public/CNAME pins the custom domain. To revert to the github.io/elezon
          # preview, set VITE_BASE=/elezon/ here and delete public/CNAME.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
