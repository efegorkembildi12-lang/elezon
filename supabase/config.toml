# ELEZON — Supabase project config (CLI). Link with:
#   supabase link --project-ref qynfoajwaamqgofqdzso
project_id = "qynfoajwaamqgofqdzso"

# Notification Edge Functions are invoked by a database webhook, not by an
# end user with a JWT. They are protected instead by the WEBHOOK_SECRET header
# checked inside each function — so JWT verification is turned off.
[functions.notify-order]
verify_jwt = false

[functions.notify-lead]
verify_jwt = false

# Team management is called from the admin browser with the user's JWT, but the
# function verifies admin membership itself (and must return CORS/JSON for the
# preflight + 401/403 cases), so platform JWT verification is off here too.
[functions.team]
verify_jwt = false
